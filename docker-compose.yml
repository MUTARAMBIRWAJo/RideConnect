services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rideconnect_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www:cached
    user: "1000:1000"
    command: /bin/sh /var/www/scripts/entrypoint.sh
    ports:
      - "8000:10000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      GOOGLE_MAPS_API_KEY: AIzaSyDi6WNLqm2hxqOftbWYZQTX4UWc5M2GN5s
      DB_CONNECTION: pgsql
      DB_HOST: aws-1-us-east-1.pooler.supabase.com
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: postgres.tpahuvmhlfluztuhznfj
      DB_PASSWORD: k66JhsiIhCBkPcs3
      DB_SSLMODE: require
      SUPABASE_URL: https://tpahuvmhlfluztuhznfj.supabase.co
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwYWh1dm1obGZsdXp0dWh6bmZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU5OTg1ODQsImV4cCI6MjA4MTU3NDU4NH0.iwwdBlMDl-X97_ozEEaEBah8vBQ5Em02f0praEr6m0U
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwYWh1dm1obGZsdXp0dWh6bmZqIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NTk5ODU4NCwiZXhwIjoyMDgxNTc0NTg0fQ.DxszTVnPVdC1o9m8ew3WOEgY-POblWGgiNKS_cFLGwg
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EVENT_BUS_DRIVER: database
      QUEUE_CONNECTION: database
      TFLITE_ENDPOINT: http://ml-service:8001
      TFLITE_TIMEOUT: 15
    depends_on:
      redis:
        condition: service_started
      ml-service:
        condition: service_healthy
    networks:
      - rideconnect

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rideconnect_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www:cached
    user: "1000:1000"
    command: >
      php artisan queue:work database
      --queue=events,reporting,default
      --sleep=3
      --tries=3
      --timeout=120
      --max-jobs=500
      --max-time=3600
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: aws-1-us-east-1.pooler.supabase.com
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: postgres.tpahuvmhlfluztuhznfj
      DB_PASSWORD: rOnptMsAAnTbrpIY
      DB_SSLMODE: require
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
      TFLITE_ENDPOINT: http://ml-service:8001
      TFLITE_TIMEOUT: 15
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
      ml-service:
        condition: service_healthy
    networks:
      - rideconnect

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rideconnect_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www:cached
    user: "1000:1000"
    command: php artisan schedule:work
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: aws-1-us-east-1.pooler.supabase.com
      DB_PORT: 5432
      DB_DATABASE: postgres
      DB_USERNAME: postgres.tpahuvmhlfluztuhznfj
      DB_PASSWORD: rOnptMsAAnTbrpIY
      DB_SSLMODE: require
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
    depends_on:
      - app
    networks:
      - rideconnect

  redis:
    image: redis:7-alpine
    container_name: rideconnect_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - rideconnect

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: rideconnect_ml
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MODEL_PATH=/app/models/Matching_Modal_tflite_learn_1013157_3.tflite
      - DATABASE_URL=postgresql+psycopg2://postgres.tpahuvmhlfluztuhznfj:rOnptMsAAnTbrpIY@aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - rideconnect

networks:
  rideconnect:
    driver: bridge

volumes:
  redis_data:
    driver: local
