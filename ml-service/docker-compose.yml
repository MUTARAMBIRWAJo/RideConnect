version: '3.8'

services:
  # Redis for caching and session management
  redis:
    image: redis:7.2-alpine
    container_name: rideconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rideconnect-network

  # ML Microservice
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rideconnect-ml-service
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - ML_SERVICE_HOST=0.0.0.0
      - ML_SERVICE_PORT=8000
      - MODEL_PATH=/app/models/trained/rideconnect_v2_best.keras
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rideconnect-network
    restart: unless-stopped

  # One-shot database bootstrap service
  init-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rideconnect-ml-init-db
    env_file:
      - ../.env
    command: ["python", "-m", "app.scripts.init_db"]
    depends_on:
      - redis
    profiles:
      - init
    volumes:
      - ./models:/app/models:ro
      - ./app:/app/app:ro
    networks:
      - rideconnect-network
    restart: "no"

  # Nginx reverse proxy (optional but recommended for production)
  nginx:
    image: nginx:latest
    container_name: rideconnect-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ml-service
    networks:
      - rideconnect-network
    restart: unless-stopped

  # RQ worker to process background retrain jobs
  rq-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rideconnect-rq-worker
    command: rq worker default
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./train:/app/train:ro
    networks:
      - rideconnect-network
    restart: unless-stopped

  # Optional Celery worker for future use (disabled unless enabled)
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rideconnect-celery-worker
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    networks:
      - rideconnect-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  rideconnect-network:
    driver: bridge
