services:
  - type: web
    name: rideconnect-api
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://rideconnect-emp0.onrender.com
      - key: TFLITE_ENDPOINT
        value: https://ml-service-j72g.onrender.com
      - key: TFLITE_TIMEOUT
        value: "20"
      - key: APP_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false

  - type: web
    name: ml-service
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    envVars:
      - key: PORT
        value: "8001"
      - key: MODEL_PATH
        value: /app/Matching_Modal_tflite_learn_1013157_3.tflite
    healthCheckPath: /health
