services:
  - type: web
    name: rideconnect-api
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache
    # Run pending migrations, start a background queue worker (drains RetryTripMatchingJob
    # so trips advance past SEARCHING), then serve the API in the foreground.
    # NOTE: the worker shares the web instance. For higher volume, promote it to a dedicated
    # Render `type: worker` service running the same `php artisan queue:work` command.
    startCommand: php artisan db:migrate-seed-protect --use-marker --seed-marker=rideconnect-production && (php artisan queue:work --tries=1 --sleep=3 --timeout=90 &) && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      # Postgres-backed queue (jobs table) so delayed matching retries are actually processed.
      - key: QUEUE_CONNECTION
        value: database
      # 'debug' assigns the nearest available driver at the widest radius (great for demos).
      # Switch to 'live' for production once real drivers are online.
      - key: MATCHING_MODE
        value: debug
      - key: APP_URL
        value: https://rideconnect-emp0.onrender.com
      - key: TFLITE_ENDPOINT
        value: https://ml-service-j72g.onrender.com
      - key: TFLITE_TIMEOUT
        value: "20"
      - key: APP_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FCM_SERVER_KEY
        sync: false

  - type: web
    name: ml-service
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    envVars:
      - key: PORT
        value: "8001"
      - key: MODEL_PATH
        value: /app/Matching_Modal_tflite_learn_1013157_3.tflite
    healthCheckPath: /health
